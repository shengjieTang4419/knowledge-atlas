# 提交前门禁 · 与 Makefile 的 lint 同口径
#
# 为什么用 local + `uv run`：本项目依赖由 uv 管理，
# 若用 mirrors-* 的 remote hook 会另建一套隔离环境重复装依赖，版本漂移后本地过、他处挂。
# 直接调项目自己的工具，口径天然一致。
#
# 安装：uv run pre-commit install
# 全量手动跑：uv run pre-commit run --all-files

repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check（app/ + tests/）
        entry: uv run ruff check app/ tests/
        language: system
        pass_filenames: false
        types: [python]

      - id: mypy-strict
        name: mypy --strict（仅 app/，契约以生产代码为准）
        entry: uv run mypy app/
        language: system
        pass_filenames: false
        types: [python]
